name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build runexe.exe and runner.exe
      run: make BUILDID=${{ github.run_number }}

    - name: Upload runexe
      uses: actions/upload-artifact@v7
      with:
        name: runexe.exe
        path: runexe.exe
        if-no-files-found: error

    - name: Upload runner
      uses: actions/upload-artifact@v7
      with:
        name: runner.exe
        path: runner.exe
        if-no-files-found: error
